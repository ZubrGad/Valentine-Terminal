<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VALENTINE TERMINAL</title>
  <style>
    :root{
      --bg:#050805;
      --fg:#7CFF7C;
      --fg2:#2fe82f;
      --dim:#1c3a1c;
      --warn:#ff4d4d;
      --ok:#7CFF7C;
      --glow: 0 0 12px rgba(124,255,124,.45), 0 0 26px rgba(124,255,124,.20);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: radial-gradient(1200px 900px at 50% 35%, #0a140a 0%, var(--bg) 55%, #020402 100%);
      color: var(--fg);
      font-family: var(--mono);
    }

    /* CRT vibe */
    .crt {
      position: relative;
      height: 100%;
      overflow: hidden;
    }
    .crt::before{
      content:"";
      position:absolute; inset:0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.02) 0px,
        rgba(255,255,255,0.02) 1px,
        rgba(0,0,0,0.00) 2px,
        rgba(0,0,0,0.00) 4px
      );
      pointer-events:none;
      mix-blend-mode: overlay;
      opacity: .25;
    }
    .crt::after{
      content:"";
      position:absolute; inset:-2px;
      background: radial-gradient(800px 500px at 50% 40%, rgba(124,255,124,.10), transparent 60%);
      pointer-events:none;
      opacity: .45;
      filter: blur(1px);
    }

    .frame{
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 18px 80px;
      position: relative;
      z-index: 2;
    }

    .header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      border: 1px solid rgba(124,255,124,.25);
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: var(--glow);
      background: rgba(0,0,0,.25);
      backdrop-filter: blur(2px);
    }

    .title{
      letter-spacing: .12em;
      font-size: 13px;
      text-transform: uppercase;
      color: var(--fg2);
      text-shadow: var(--glow);
      margin: 0;
      line-height: 1.2;
    }

    .badge{
      font-size: 12px;
      padding: 6px 10px;
      border: 1px solid rgba(124,255,124,.35);
      border-radius: 999px;
      color: var(--fg2);
      background: rgba(0,0,0,.35);
      box-shadow: var(--glow);
      white-space: nowrap;
    }

    .screen{
      margin-top: 18px;
      border: 1px solid rgba(124,255,124,.22);
      border-radius: 18px;
      background: rgba(0,0,0,.22);
      box-shadow: var(--glow);
      padding: 18px 16px;
      min-height: 60vh;
    }

    pre{
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
      font-size: 14px;
      text-shadow: 0 0 10px rgba(124,255,124,.18);
    }

    .row{
      display:flex;
      gap: 10px;
      align-items:center;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    input{
      flex: 1 1 220px;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid rgba(124,255,124,.35);
      background: rgba(0,0,0,.55);
      color: var(--fg);
      font-family: var(--mono);
      outline: none;
      box-shadow: inset 0 0 0 9999px rgba(0,0,0,.0);
    }
    input::placeholder{ color: rgba(124,255,124,.45); }

    button{
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(124,255,124,.45);
      background: rgba(0,0,0,.45);
      color: var(--fg2);
      font-family: var(--mono);
      cursor:pointer;
      box-shadow: var(--glow);
    }
    button:hover{ filter: brightness(1.1); }
    button:active{ transform: translateY(1px); }

    .hint{
      margin-top: 10px;
      color: rgba(124,255,124,.65);
      font-size: 12px;
    }

    .status{
      margin-top: 12px;
      font-size: 12px;
      color: rgba(124,255,124,.70);
    }
    .status.error{ color: var(--warn); text-shadow: 0 0 12px rgba(255,77,77,.25); }
    .status.ok{ color: var(--ok); }

    .progress{
      margin-top: 14px;
      height: 10px;
      border-radius: 999px;
      border: 1px solid rgba(124,255,124,.35);
      background: rgba(0,0,0,.35);
      overflow: hidden;
      display:none;
    }
    .bar{
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, rgba(124,255,124,.25), rgba(124,255,124,.85), rgba(124,255,124,.25));
      box-shadow: var(--glow);
    }

    .cursor {
      display:inline-block;
      width: 10px;
      animation: blink 1s steps(2, start) infinite;
    }
    @keyframes blink { to { visibility: hidden; } }

    .footer{
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      font-size: 11px;
      color: rgba(124,255,124,.55);
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(124,255,124,.18);
      padding: 8px 10px;
      border-radius: 999px;
    }

    /* mobile comfort */
    @media (max-width: 420px){
      pre{ font-size: 13px; }
      .badge{ display:none; }
    }
  </style>
</head>

<body>
  <div class="crt">
    <div class="frame">
      <div class="header">
        <h1 class="title">VALENTINE // SECURE MESSAGE TERMINAL</h1>
        <div class="badge" id="clock">SYNCING...</div>
      </div>

      <div class="screen">
        <pre id="out"></pre>

        <div class="row" id="loginRow" style="display:none;">
          <input id="pw" type="password" autocomplete="off" placeholder="PASSWORD" />
          <button id="enterBtn">ENTER</button>
        </div>

        <div class="progress" id="progress">
          <div class="bar" id="bar"></div>
        </div>

        <div class="status" id="status"></div>
        <div class="hint" id="hint"></div>
      </div>
    </div>

    <div class="footer">Tip: auf dem Handy quer drehen = mehr Terminal-Vibes.</div>
  </div>

<script>
  /***************
   * KONFIG
   ***************/
  const PASSWORD = "hannah<3";  // <-- HIER DEIN PASSWORT setzen (klein/groß beachten)
  const OWNER_NAME = "Hannah";  // optional: Name

  // <-- HIER DEINE NACHRICHT EINTRAGEN:
  const SECRET_MESSAGE = `
Hey ${OWNER_NAME},

[Schreib hier deinen Text rein.]

Ich hab dich lieb.
— [Dein Name]
  `.trim();

  /***************
   * TERMINAL ENGINE
   ***************/
  const out = document.getElementById("out");
  const statusEl = document.getElementById("status");
  const hintEl = document.getElementById("hint");
  const loginRow = document.getElementById("loginRow");
  const pw = document.getElementById("pw");
  const btn = document.getElementById("enterBtn");
  const progress = document.getElementById("progress");
  const bar = document.getElementById("bar");

  function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

  async function typeLine(text, delay=12){
    for (let i=0;i<text.length;i++){
      out.textContent += text[i];
      await sleep(delay);
    }
    out.textContent += "\n";
    scrollToBottom();
  }

  function scrollToBottom(){
    const screen = document.querySelector(".screen");
    screen.scrollTop = screen.scrollHeight;
  }

  function setStatus(text, kind=""){
    statusEl.textContent = text || "";
    statusEl.className = "status" + (kind ? " " + kind : "");
  }

  function setHint(text){
    hintEl.textContent = text || "";
  }

  function showLogin(){
    loginRow.style.display = "flex";
    pw.focus();
    setHint("Hinweis: Groß-/Kleinschreibung zählt.");
  }

  async function boot(){
    out.textContent = "";
    setStatus("");
    setHint("");

    const lines = [
      "BOOTING VALENTINE OS v1.4.2 ...",
      "LOADING MODULES: [terminal] [encryption] [romance] ...",
      "CHECKING INTEGRITY .......... OK",
      "ESTABLISHING SECURE LINK .... OK",
      "",
      "AUTH REQUIRED",
      "ENTER PASSWORD TO CONTINUE",
      ""
    ];

    for (const l of lines){
      await typeLine(l, 10);
      await sleep(90);
    }

    out.textContent += "> ";
    out.textContent += "█\n";
    showLogin();
  }

  async function decryptSequence(){
    loginRow.style.display = "none";
    setHint("");
    setStatus("ACCESS GRANTED", "ok");

    // remove the block cursor line (last line)
    out.textContent = out.textContent.replace(/\n> █\n?$/, "\n> ********\n");

    await sleep(400);
    await typeLine("", 0);
    await typeLine("INITIALIZING DECRYPTION...", 12);
    await typeLine("USING KEY EXCHANGE: OK", 12);
    await typeLine("DECRYPTING PAYLOAD...", 12);

    progress.style.display = "block";
    bar.style.width = "0%";

    for (let p=0; p<=100; p+=2){
      bar.style.width = p + "%";
      await sleep(30 + Math.random()*40);
    }

    await sleep(250);
    progress.style.display = "none";
    await typeLine("", 0);
    await typeLine("DONE.", 12);
    await sleep(250);

    // Clear and print message
    out.textContent = "";
    await typeLine("----- SECURE MESSAGE BEGIN -----", 6);
    await typeLine("", 0);

    // Type message a bit slower for drama
    const msgLines = SECRET_MESSAGE.split("\n");
    for (const l of msgLines){
      await typeLine(l, 12);
      await sleep(60);
    }

    await typeLine("", 0);
    await typeLine("----- SECURE MESSAGE END -----", 6);
    await typeLine("", 0);
    out.textContent += ">";
    out.textContent += " ";
    out.textContent += "█";
  }

  function deny(){
    setStatus("ACCESS DENIED", "error");
    setHint("Tipp: Vielleicht ein Insider? 🫶");
    pw.value = "";
    pw.focus();
  }

  async function handleLogin(){
    const entered = pw.value;
    // little "thinking"
    setStatus("VERIFYING...", "");
    await sleep(250);

    if (entered === PASSWORD){
      await decryptSequence();
    } else {
      deny();
    }
  }

  btn.addEventListener("click", handleLogin);
  pw.addEventListener("keydown", (e) => {
    if (e.key === "Enter") handleLogin();
  });

  // clock badge
  function tickClock(){
    const el = document.getElementById("clock");
    const d = new Date();
    const hh = String(d.getHours()).padStart(2,"0");
    const mm = String(d.getMinutes()).padStart(2,"0");
    el.textContent = `BERLIN ${hh}:${mm}`;
  }
  setInterval(tickClock, 1000);
  tickClock();

  boot();
</script>
</body>
</html>
